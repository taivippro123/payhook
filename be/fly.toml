# fly.toml app configuration file generated for payhook-taivippro123 on 2025-11-11T16:50:40+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'payhook-taivippro123'
primary_region = 'sin'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  FRONTEND_URL = 'https://payhook.vercel.app'
  BACKEND_URL = 'https://payhook-taivippro123.fly.dev'
  GOOGLE_REDIRECT_URI = 'https://payhook-taivippro123.fly.dev/api/auth/google/callback'
  GOOGLE_LOGIN_REDIRECT_URI = 'https://payhook-taivippro123.fly.dev/api/auth/google/login/callback'
  PAYMENT_QR_BASE_URL = 'https://payhook.vercel.app/api/qr/img'
  VAPID_SUBJECT = 'mailto:phanvothanhtai1007@gmail.com'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

  [[services.http_checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '10s'
    method = 'get'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
